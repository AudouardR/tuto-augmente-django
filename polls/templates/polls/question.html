{% extends "base.html" %}

{% block title %}Sondages - Créer{% endblock %}

{% block header %}
    <h1>Créer un sondage</h1>
{% endblock %}

{% block main %}

<form action="{% url 'polls:save_question' %}" method="post">
    {% csrf_token %}

    {% include "polls/form_snippet.html" %}

    <button type="submit">Créer le sondage</button>
</form>
<a href="javascript:history.back()">Retour aux sondages</a>

{% endblock %}
